packages:
  - "apps/*"
  - "packages/*"
  - "workers"
  - "tests"

# pnpm 10+/11 refuse to run dependency build scripts unless each one is listed here as allowed (true)
# or skipped (false); pnpm 11 fails the install with ERR_PNPM_IGNORED_BUILDS for unlisted ones.
# esbuild/unrs-resolver postinstalls only validate a native binary and fail on hosts that forbid
# executing files during install (EACCES); both packages work at runtime without them.
allowBuilds:
  prisma: true
  "@prisma/engines": true
  "@prisma/client": true
  sharp: true
  esbuild: false
  unrs-resolver: false
onlyBuiltDependencies:
  - prisma
  - "@prisma/engines"
  - "@prisma/client"
  - sharp
ignoredBuiltDependencies:
  - esbuild
  - unrs-resolver
minimumReleaseAge: 0
