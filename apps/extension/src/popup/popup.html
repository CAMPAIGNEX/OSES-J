<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OSES-J</title>
    <style>
      :root { color-scheme: light dark; --brand: #007fff; --bg: #f6f8fb; --surface: #fff; --border: #e3e8ef; --text: #0f172a; --muted: #64748b; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --surface: #111a2b; --border: #223049; --text: #e6edf7; --muted: #a7b4c8; } }
      body { width: 340px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
      h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 15px; }
      h1 span.logo { display: inline-flex; width: 24px; height: 24px; border-radius: 7px; background: var(--brand); color: #fff; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
      label { display: block; font-size: 12px; font-weight: 600; margin: 8px 0 4px; }
      input { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); font: inherit; }
      button { font: inherit; border: 0; border-radius: 7px; padding: 7px 11px; cursor: pointer; background: var(--brand); color: #fff; font-weight: 600; }
      button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
      button:disabled { opacity: 0.6; cursor: default; }
      .row { display: flex; gap: 6px; margin-top: 10px; }
      .status { display: flex; align-items: center; gap: 8px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #94a3b8; }
      .dot.on { background: #10b981; }
      .dot.warn { background: #f59e0b; }
      .muted { color: var(--muted); font-size: 12px; }
      ul { list-style: none; padding: 0; margin: 6px 0 0; max-height: 150px; overflow: auto; }
      li { padding: 4px 0; border-top: 1px solid var(--border); font-size: 11.5px; }
      li.error { color: #dc2626; } li.warn { color: #d97706; }
      .err { color: #dc2626; font-size: 12px; margin-top: 6px; }
      code { font-family: ui-monospace, monospace; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1><span class="logo">J</span> OSES-J automation</h1>
    <div id="pair" class="card" hidden>
      <p class="muted">Pair this browser with your OSES-J workspace. In OSES-J open <b>Settings → Automation</b> and click “Pair extension”.</p>
      <label for="server">OSES-J server URL</label>
      <input id="server" placeholder="https://your-oses-j.example.com" />
      <label for="code">Pairing code</label>
      <input id="code" placeholder="ABCD2345" autocomplete="off" style="letter-spacing: 0.2em; text-transform: uppercase" />
      <div class="row"><button id="pairBtn">Pair</button></div>
      <div id="pairError" class="err" hidden></div>
    </div>
    <div id="connected" class="card" hidden>
      <div class="status"><span id="dot" class="dot"></span><b id="statusText">Connected</b></div>
      <p class="muted" id="serverText"></p>
      <p class="muted" id="loginText"></p>
      <p class="muted" id="jobText"></p>
      <div class="row">
        <button id="pauseBtn" class="secondary">Pause</button>
        <button id="checkBtn" class="secondary">Check now</button>
        <button id="disconnectBtn" class="secondary">Disconnect</button>
      </div>
    </div>
    <div class="card" id="activityCard" hidden>
      <b>Recent activity</b>
      <ul id="activity"></ul>
    </div>
    <p class="muted">The extension only acts on jobs you approved in OSES-J and never reads or sends your Instagram/Facebook password.</p>
    <script src="popup.js" type="module"></script>
  </body>
</html>
